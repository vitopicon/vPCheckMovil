plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vpcheck.movil'
    compileSdk 34

    defaultConfig {
        applicationId "com.vpcheck.movil"
        minSdk 26          // Android 8.0 o superior
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la clave de depuración para poder instalarlo directamente.
            // Si algún día se publica en Google Play, cambia esto por tu propia clave.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
