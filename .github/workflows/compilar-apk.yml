name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Compilar
        run: |
          if [ ! -f gradlew ] && [ -f vPCheckMovil/gradlew ]; then cd vPCheckMovil; fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/vPCheck-Movil.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: vPCheck-Movil-apk
          path: vPCheck-Movil.apk
